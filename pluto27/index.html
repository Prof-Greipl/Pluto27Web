<html data-bs-theme="light">

<head>
    <title>
        Pluto 27
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"

</head>

<body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2">

            <a class="navbar-brand" href="#">Pluto27Web</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav"

                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

                <div class="drawer-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#mainArea">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#signInArea">Sign In</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#manageAccountArea">Manage Account</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>
    <div id="mainArea" style="background-color: rgb(36, 142, 32);">
        <h3>mainArea</h1>
    </div>

    <div id="signInArea" style="background-color: rgb(236, 207, 204);">
        <h3>signInArea</h1>
    </div>

    <div id="manageAccountArea" style="background-color: rgb(205, 229, 178);">
        <h3>manageAccountArea</h1>
    </div>

    <script>
        window.addEventListener("hashchange", () => {
            console.log("New hash = ", window.location.hash)
        })
