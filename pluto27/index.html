<html data-bs-theme="light">

<head>
    <title>
        Pluto 27
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <style>
        .screen {
            display: none;
        }

        .sichtbar {
            display: block;
        }
    </style>
</head>

<body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#mainArea">Pluto27Web</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#mainArea">Main</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#signInArea">Sign In</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#manageAccountArea">Manage Account</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>
    <div id="mainArea" class="screen container">
        <h1>Chats</h1>
        <div class="input-group">
            <input type="text" class="form-control" placeholder="" aria-label="Example text with button addon"
                aria-describedby="button-addon">
            <button class="btn-outline theme-secondary input-group-btn" type="button" id="button-addon">
                Button
            </button>
        </div>
        <button id="area_main_test" type="button" class="btn btn-primary mt-5">Add Chat (Test)
        </button>
        <ul class="list-group" id="main_area_post_list"></ul>
    </div>

    <div id="signInArea" class="screen container">
        <h1>SignIn</h1>
        <input id="si_email" type="email" class="form-control mt-5" placeholder="E-Mail" />

        <input id="si_password" type="password" class="form-control mt-5" placeholder="Password" />

        <button id="si_bu_sign_in" type="button" class="btn btn-primary mt-5">Sign In</button><br>
        <button id="si_bu_reset_password" type="button" class="btn btn-secondary mt-5">Reset Password</button>
    </div>

    <div id="manageAccountArea" class="screen container">
        <h1>Manage Account</h1>
    </div>

    <dialog class="dialog" id="my_dialog">
        <div class="dialog-header">
            <h1 class="dialog-title" id="dia_title">Dialog title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <p id="dia_body">...</p>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Close</button>
        </div>
    </dialog>

    <template id="main_area_template">
        <li class="list-group-item">
            <div>Zeile 1</div>
            <div>Zeile 2</div>
        </li>
    </template>
    <script>
        document.getElementById("area_main_test")
            .addEventListener("click", () => {
                let li = document.getElementById("main_area_template").content.cloneNode(true)
                document.getElementById("main_area_post_list").appendChild(li)
            })

        function display_dialog(title, body) {
            document.getElementById("dia_title").textContent = title
            document.getElementById("dia_body").textContent = body
            document.getElementById("my_dialog").showModal()
        }

        function showScreen(hash) {
            // Open Modal if page not implemented - remove later
            if (hash == "#manageAccountArea") {
                display_dialog("Info", "Not yet implemented")
                location.hash = "#mainArea"
                return
            }

            // Alte Area unsichtbar machen
            elements = document.querySelectorAll('.sichtbar')
            elements.forEach(element => {
                element.classList.remove('sichtbar')
            });
            // Neue Area anzeigen.
            activeScreen = document.querySelector(hash)
            if (activeScreen) {
                activeScreen.classList.add("sichtbar")
            }
        }

        window.addEventListener("hashchange", () => {
            const h = location.hash
            showScreen(h)
        })

        window.addEventListener("load", () => {
            // Zeige immer die #mainArea an..
            location.hash = "#mainArea"
            showScreen("#mainArea")
        })
    </script>
</body>

</html>
