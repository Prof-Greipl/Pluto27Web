<html data-bs-theme="light">

<head>
    <title>
        Pluto 27
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <style>
        .screen { display : none; }
        .sichtbar { display: block; }
    </style>
</head>

<body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#mainArea">Pluto27Web</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#mainArea">Main</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#signInArea">Sign In</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#manageAccountArea">Manage Account</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>
    <div id="mainArea" class="screen container" style="background-color: rgb(36, 142, 32);">
        <h1>mainArea</h1>
    </div>

    <div id="signInArea" class="screen container">
        <h1>SignIn</h1>
        <input id="si_email" type="email" class="form-control mt-5"
            placeholder="E-Mail" />

        <input id="si_password" type="password" class="form-control mt-5"
            placeholder="Password" />
           
        <button id="si_bu_sign_in" type="button" class="btn btn-primary mt-5">Sign In</button><br>
        <button id="si_bu_reset_password" type="button" class="btn btn-secondary mt-5">Reset Password</button>

    </div>

    <div id="manageAccountArea" class="screen container" style="background-color: rgb(205, 229, 178);">
        <h3>manageAccountArea</h1>
    </div>

    <script>
        function showScreen( hash ){
            // Alte Area unsichtbar machen
            elements = document.querySelectorAll('.sichtbar')
            elements.forEach(element => {
                element.classList.remove('sichtbar')
            });
            // Neue Area anzeigen.
            activeScreen = document.querySelector(hash)
            if (activeScreen) {
                activeScreen.classList.add("sichtbar")
            }
        }

        window.addEventListener("hashchange", () => {
            const h = location.hash
            showScreen( h )
        })

        window.addEventListener("load", () =>{
            // Zeige immer die #mainArea an..
            location.hash ="#signInArea"
            showScreen( "#signInArea")
        })
    </script>
</body>

</html>
